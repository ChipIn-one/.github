name: Tests
description: Add or improve verification coverage without changing product behavior
title: ""
type: Task
body:
  - type: markdown
    attributes:
      value: |
        After creation, run `ChipIn-one/.github` -> Actions -> `Issue metadata finalizer` and supply explicit Organization Issue Fields `Priority` and `Release scope`; set `Severity` only when applicable. The finalizer also ensures one Project #5 membership and a readable `Status`. Do not add legacy metadata labels/milestones or infer fallback values.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What behavior or risk is currently not verified well enough?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Outcome
      description: What verification coverage should exist when complete?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance
      description: Add checkable coverage and test-execution criteria.
      placeholder: "- [ ] ..."
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies
      description: List required fixtures, product changes, or other blocking work.
    validations:
      required: false
  - type: textarea
    id: references
    attributes:
      label: References
      description: Link relevant code, failures, PRs, specs, or historical Trello cards.
    validations:
      required: false
