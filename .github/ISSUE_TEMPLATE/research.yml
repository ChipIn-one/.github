name: Research
description: Investigate a bounded question before a decision or implementation
title: ""
type: Task
body:
  - type: markdown
    attributes:
      value: |
        After creation, run `ChipIn-one/.github` -> Actions -> `Issue metadata finalizer` and supply explicit Organization Issue Field `Priority`; set `Severity` only when applicable. The finalizer also ensures one Project #5 membership and a readable `Status`; native Milestone is optional and preserved as-is. Do not add legacy metadata labels, do not create generic `PRE-PROD`/`POST-PROD` milestones, and do not infer fallback values.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What uncertainty or decision needs evidence?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Outcome
      description: What decision-ready result should the research produce?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance
      description: Define evidence and completion criteria for the research.
      placeholder: "- [ ] ..."
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies
      description: List required source material, access, or prior decisions.
    validations:
      required: false
  - type: textarea
    id: references
    attributes:
      label: References
      description: Link source material, related issues, or historical Trello cards.
    validations:
      required: false
