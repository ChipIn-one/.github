name: Research
description: Investigate a bounded question before a decision or implementation
title: ""
type: Task
body:
  - type: markdown
    attributes:
      value: |
        Use canonical structured metadata after creation: Organization Issue Fields `Priority` and `Release scope`; `Severity` only when applicable; Project #5 `Status` is workflow state. Do not add legacy metadata labels/milestones. If structured fields are not visible, do not infer fallback values.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What uncertainty or decision needs evidence?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Outcome
      description: What decision-ready result should the research produce?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance
      description: Define evidence and completion criteria for the research.
      placeholder: "- [ ] ..."
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies
      description: List required source material, access, or prior decisions.
    validations:
      required: false
  - type: textarea
    id: references
    attributes:
      label: References
      description: Link source material, related issues, or historical Trello cards.
    validations:
      required: false
