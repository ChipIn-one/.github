name: Bug report
description: Report incorrect existing behavior
title: ""
type: Bug
body:
  - type: markdown
    attributes:
      value: |
        After creation, run `ChipIn-one/.github` -> Actions -> `Issue metadata finalizer` and supply explicit Organization Issue Fields `Priority` and `Severity`. The finalizer also ensures one Project #5 membership and a readable `Status`; native Milestone is optional and preserved as-is. Do not add legacy `P*`, `severity:*`, or `type:*` labels, do not create generic `PRE-PROD`/`POST-PROD` milestones, and do not infer fallback values.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the incorrect behavior, expected behavior, reproduction, and relevant evidence.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Outcome
      description: Describe the observable corrected state without prescribing unnecessary implementation detail.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance
      description: Add checkable acceptance criteria.
      placeholder: "- [ ] ..."
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies
      description: List real blocking/required dependencies and use native GitHub relationships where available.
    validations:
      required: false
  - type: textarea
    id: references
    attributes:
      label: References
      description: Link specs, ADRs, PRs, evidence, or historical Trello cards.
    validations:
      required: false
