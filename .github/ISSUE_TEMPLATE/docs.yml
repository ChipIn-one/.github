name: Documentation
description: Create or correct durable documentation
title: ""
type: Task
body:
  - type: markdown
    attributes:
      value: |
        Use canonical structured metadata after creation: Organization Issue Fields `Priority` and `Release scope`; `Severity` only when applicable; Project #5 `Status` is workflow state. Do not add legacy metadata labels/milestones. If structured fields are not visible, do not infer fallback values.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What documentation is missing, stale, duplicated, or contradictory?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Outcome
      description: What durable documentation state should be true after this task?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance
      description: Add checkable criteria, including links/indexes when relevant.
      placeholder: "- [ ] ..."
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies
      description: List blocking/required specs, decisions, or repository work.
    validations:
      required: false
  - type: textarea
    id: references
    attributes:
      label: References
      description: Link source documents, ADRs, PRs, or historical Trello cards.
    validations:
      required: false
