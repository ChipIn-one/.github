name: Enhancement
description: Propose a product or engineering capability
title: ""
type: Feature
body:
  - type: markdown
    attributes:
      value: |
        Use canonical structured metadata after creation: Organization Issue Fields `Priority` and `Release scope`; `Severity` only when applicable; Project #5 `Status` is workflow state. Do not add legacy `P*`, `severity:*`, or `type:*` labels, and do not use the `PRE-PROD` milestone as release scope. If structured fields are not visible, do not infer fallback values.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem or limitation should this change address?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Outcome
      description: What observable product or engineering outcome should be true?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance
      description: Add checkable acceptance criteria.
      placeholder: "- [ ] ..."
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies
      description: List real blocking/required dependencies and use native GitHub relationships where available.
    validations:
      required: false
  - type: textarea
    id: references
    attributes:
      label: References
      description: Link specs, ADRs, PRs, related work, or historical Trello cards.
    validations:
      required: false
