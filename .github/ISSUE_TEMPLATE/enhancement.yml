name: Enhancement
description: Propose a product or engineering capability
title: ""
type: Feature
body:
  - type: markdown
    attributes:
      value: |
        After creation, run `ChipIn-one/.github` -> Actions -> `Issue metadata finalizer` and supply explicit Organization Issue Fields `Priority` and `Release scope`; set `Severity` only when applicable. The finalizer also ensures one Project #5 membership and a readable `Status`. Do not add legacy metadata labels/milestones or infer fallback values.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem or limitation should this change address?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Outcome
      description: What observable product or engineering outcome should be true?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance
      description: Add checkable acceptance criteria.
      placeholder: "- [ ] ..."
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies
      description: List real blocking/required dependencies and use native GitHub relationships where available.
    validations:
      required: false
  - type: textarea
    id: references
    attributes:
      label: References
      description: Link specs, ADRs, PRs, related work, or historical Trello cards.
    validations:
      required: false
