name: Trusted issue admission preflight

# A separately trusted external actor, or the authenticated human-orchestrator
# artifact route, may send repository_dispatch. Executor cannot dispatch.
on:
  repository_dispatch:
    types: [chipin-admission-preflight-v1]

# Authenticated run-history identity: never infer identity from a plain Issue GET.
run-name: chipin-admission-${{ github.event.client_payload.request_id }}

permissions:
  contents: read
  actions: read

jobs:
  issue-preflight:
    if: github.ref == 'refs/heads/master' && github.actor == vars.CHIPIN_TRUSTED_PREFLIGHT_ACTOR && github.triggering_actor == vars.CHIPIN_TRUSTED_PREFLIGHT_ACTOR && vars.CHIPIN_TRUSTED_PREFLIGHT_ACTOR != ''
    # Serialized per human request; existing external actor uses a unique group.
    concurrency:
      group: ${{ github.actor == 'github-actions[bot]' && format('chipin-human-admission-{0}-{1}-{2}', github.event.client_payload.orchestrator_run_id, github.event.client_payload.orchestrator_run_attempt, github.event.client_payload.request_id) || format('chipin-external-admission-{0}', github.run_id) }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Trusted master checkout (never task or PR code)
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Node 24.21.0
        uses: actions/setup-node@v7.1.0
        with:
          node-version: '24.21.0'
      - name: Authenticate human orchestrator artifact when dispatch actor is shared Actions bot
        if: github.actor == 'github-actions[bot]'
        env:
          ACTIONS_READ_TOKEN: ${{ github.token }}
          CHIPIN_TRUSTED_PREFLIGHT_ACTOR: ${{ vars.CHIPIN_TRUSTED_PREFLIGHT_ACTOR }}
        run: node automation/issue-admission-human-orchestrator.mjs verify
      - name: Canonical read-only issue preflight
        env:
          GITHUB_TOKEN: ${{ secrets.CHIPIN_DEV_READ_TOKEN }}
          CHIPIN_TRUSTED_PREFLIGHT_ACTOR: ${{ vars.CHIPIN_TRUSTED_PREFLIGHT_ACTOR }}
          ISSUE: ${{ github.event.client_payload.issue }}
          OWNER: ${{ github.event.client_payload.owner }}
          REQUEST_ID: ${{ github.event.client_payload.request_id }}
          EXPECTED_REVISION: ${{ github.event.client_payload.expected_revision }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${GITHUB_TOKEN:-}"
          args=(--issue "$ISSUE" --request-id "$REQUEST_ID" --producer actions --output admission-envelope.json)
          if [[ -n "${OWNER:-}" ]]; then args+=(--owner "$OWNER"); fi
          if [[ -n "${EXPECTED_REVISION:-}" ]]; then args+=(--expected-revision "$EXPECTED_REVISION"); fi
          if [[ "${GITHUB_ACTOR:-}" == 'github-actions[bot]' ]]; then
            node automation/issue-admission-human-orchestrator.mjs fresh
          fi
          node automation/issue-admission-preflight.mjs "${args[@]}"
          if [[ "${GITHUB_ACTOR:-}" == 'github-actions[bot]' ]]; then
            node automation/issue-admission-human-orchestrator.mjs fresh
          fi
      - name: Upload immutable run-attempt evidence
        uses: actions/upload-artifact@v7
        with:
          name: chipin-admission-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.event.client_payload.request_id }}
          path: admission-envelope.json
          if-no-files-found: error
          retention-days: 1
