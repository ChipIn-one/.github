name: Issue intake live acceptance

on:
  push:
    branches:
      - chore/issue-14-intake-live-acceptance

permissions:
  actions: write
  contents: read

jobs:
  accept:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      WRITE_TOKEN: ${{ secrets.CHIPIN_ISSUE_WRITE_TOKEN }}
      STATE_PATH: /tmp/issue-intake-acceptance-state.json
      TITLE: "Intake acceptance: API create and UI finalizer"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.21.0'

      - name: Run intake tests
        run: node --test automation/*.test.mjs

      - name: Create explicit acceptance issue
        env:
          GITHUB_TOKEN: ${{ env.WRITE_TOKEN }}
          CHIPIN_ISSUE_WRITE: "1"
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${GITHUB_TOKEN:-}" ]; then
            echo "CHIPIN_ISSUE_WRITE_TOKEN is not configured."
            exit 1
          fi
          cat > /tmp/issue-intake-acceptance-body.md <<'EOF'
          ## Purpose

          Temporary live acceptance fixture for the canonical ChipIn issue-intake path. It validates explicit API creation, organization Issue Fields / Issue Type, Project #5 membership and Status read-back.

          ## Classification

          This fixture is explicitly classified by the acceptance run as Task / P3 / POST-PROD with no Severity. No value is inferred from this title or body.

          ## Cleanup

          Close after receipts are captured. No product implementation is required.
          EOF
          node automation/issue-intake.mjs apply create ChipIn-one/chipin-frontend \
            --title "$TITLE" \
            --body-file /tmp/issue-intake-acceptance-body.md \
            --type Task \
            --priority P3 \
            --release-scope POST-PROD \
            --severity none \
            --state "$STATE_PATH" \
            --activate issue-intake-v1 \
            --output api-create-receipt.json
          node automation/issue-intake.mjs apply create ChipIn-one/chipin-frontend \
            --title "$TITLE" \
            --body-file /tmp/issue-intake-acceptance-body.md \
            --type Task \
            --priority P3 \
            --release-scope POST-PROD \
            --severity none \
            --state "$STATE_PATH" \
            --activate issue-intake-v1 \
            --output api-create-replay-receipt.json
          cp "$STATE_PATH" api-create-state.json

      - name: Dispatch UI finalizer for created issue
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          ISSUE_REF="$(node -e "const fs=require('fs'); const s=JSON.parse(fs.readFileSync(process.env.STATE_PATH,'utf8')); process.stdout.write(s.issueRef)")"
          printf '%s\n' "$ISSUE_REF" > acceptance-issue-ref.txt
          payload="$(jq -nc --arg ref main --arg issue_ref "$ISSUE_REF" '{
            ref: $ref,
            inputs: {
              issue_ref: $issue_ref,
              issue_type: "Task",
              priority: "P3",
              release_scope: "POST-PROD",
              severity: "none",
              apply: "true"
            }
          }')"
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            https://api.github.com/repos/ChipIn-one/.github/actions/workflows/issue-metadata-finalize.yml/dispatches \
            -d "$payload"

      - name: Upload API acceptance receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-intake-live-acceptance-${{ github.run_id }}
          path: |
            api-create-receipt.json
            api-create-replay-receipt.json
            api-create-state.json
            acceptance-issue-ref.txt
          if-no-files-found: warn
          retention-days: 30
