name: Issue intake credential diagnostic

on:
  push:
    branches:
      - chore/issue-14-intake-live-acceptance

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TOKEN: ${{ secrets.CHIPIN_ISSUE_WRITE_TOKEN }}
    steps:
      - name: Probe write credential read access
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${TOKEN:-}" ]; then
            echo "CHIPIN_ISSUE_WRITE_TOKEN is not configured."
            exit 1
          fi
          node <<'NODE'
          const token = process.env.TOKEN;
          const headers = {
            Accept: 'application/vnd.github+json',
            Authorization: `Bearer ${token}`,
            'X-GitHub-Api-Version': '2026-03-10',
          };

          async function rest(label, path) {
            const response = await fetch('https://api.github.com' + path, { headers });
            let detail = null;
            if (label === 'principal' && response.ok) {
              const body = await response.json();
              detail = body.login || null;
            }
            console.log(JSON.stringify({
              probe: label,
              status: response.status,
              acceptedPermissions: response.headers.get('x-accepted-github-permissions'),
              detail,
            }));
          }

          async function graphql(label, query) {
            const response = await fetch('https://api.github.com/graphql', {
              method: 'POST',
              headers: { ...headers, 'Content-Type': 'application/json' },
              body: JSON.stringify({ query }),
            });
            const payload = await response.json().catch(() => ({}));
            console.log(JSON.stringify({
              probe: label,
              status: response.status,
              data: Boolean(payload?.data),
              errors: Array.isArray(payload?.errors) ? payload.errors.map((e) => e.message) : [],
            }));
          }

          await rest('principal', '/user');
          await rest('org-issue-fields-read', '/orgs/ChipIn-one/issue-fields');
          await rest('org-issue-types-read', '/orgs/ChipIn-one/issue-types');
          await rest('project-5-rest-read', '/orgs/ChipIn-one/projectsV2/5');
          await rest('fe-issue-field-values-read', '/repos/ChipIn-one/chipin-frontend/issues/278/issue-field-values');
          await rest('kb-issue-field-values-read', '/repos/ChipIn-one/chipin-knowledge-base/issues/3/issue-field-values');
          await rest('be-issue-field-values-read', '/repos/ChipIn-one/chipin-backend/issues/145/issue-field-values');

          await graphql('project-basic', 'query { organization(login: "ChipIn-one") { projectV2(number: 5) { id title } } }');
          await graphql('project-fields-basic', 'query { organization(login: "ChipIn-one") { projectV2(number: 5) { fields(first: 100) { nodes { __typename ... on ProjectV2Field { id name dataType isIssueField } ... on ProjectV2SingleSelectField { id name dataType isIssueField options { id name } } } } } } }');
          await graphql('project-fields-linked-issue-fields', 'query { organization(login: "ChipIn-one") { projectV2(number: 5) { fields(first: 100) { nodes { __typename ... on ProjectV2Field { id name isIssueField issueField { __typename ... on IssueFieldSingleSelect { fullDatabaseId name } } } ... on ProjectV2SingleSelectField { id name isIssueField issueField { __typename ... on IssueFieldSingleSelect { fullDatabaseId name } } } } } } } }');
          await graphql('project-items-basic', 'query { organization(login: "ChipIn-one") { projectV2(number: 5) { items(first: 100) { nodes { id } } } } }');
          await graphql('project-items-content', 'query { organization(login: "ChipIn-one") { projectV2(number: 5) { items(first: 100) { nodes { id content { __typename ... on Issue { number repository { nameWithOwner } } } } } } } }');
          await graphql('project-items-status', 'query { organization(login: "ChipIn-one") { projectV2(number: 5) { items(first: 100) { nodes { id fieldValueByName(name: "Status") { __typename ... on ProjectV2ItemFieldSingleSelectValue { name } } } } } } }');
          NODE
