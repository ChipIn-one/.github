name: Issue intake credential diagnostic

on:
  push:
    branches:
      - chore/issue-14-intake-live-acceptance

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TOKEN: ${{ secrets.CHIPIN_ISSUE_WRITE_TOKEN }}
    steps:
      - name: Probe write credential read access
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${TOKEN:-}" ]; then
            echo "CHIPIN_ISSUE_WRITE_TOKEN is not configured."
            exit 1
          fi
          node <<'NODE'
          const token = process.env.TOKEN;
          const headers = {
            Accept: 'application/vnd.github+json',
            Authorization: `Bearer ${token}`,
            'X-GitHub-Api-Version': '2026-03-10',
          };

          async function rest(label, path) {
            const response = await fetch('https://api.github.com' + path, { headers });
            let detail = null;
            if (label === 'principal' && response.ok) {
              const body = await response.json();
              detail = body.login || null;
            }
            console.log(JSON.stringify({
              probe: label,
              status: response.status,
              acceptedPermissions: response.headers.get('x-accepted-github-permissions'),
              detail,
            }));
            return response.status;
          }

          await rest('principal', '/user');
          await rest('org-issue-fields-read', '/orgs/ChipIn-one/issue-fields');
          await rest('org-issue-types-read', '/orgs/ChipIn-one/issue-types');
          await rest('project-5-rest-read', '/orgs/ChipIn-one/projectsV2/5');
          await rest('repo-fe-visible', '/repos/ChipIn-one/chipin-frontend');
          await rest('repo-kb-visible', '/repos/ChipIn-one/chipin-knowledge-base');
          await rest('repo-be-visible', '/repos/ChipIn-one/chipin-backend');

          const gql = await fetch('https://api.github.com/graphql', {
            method: 'POST',
            headers: { ...headers, 'Content-Type': 'application/json' },
            body: JSON.stringify({
              query: 'query { organization(login: "ChipIn-one") { projectV2(number: 5) { id title } } }',
            }),
          });
          const payload = await gql.json().catch(() => ({}));
          console.log(JSON.stringify({
            probe: 'project-5-graphql-read',
            status: gql.status,
            projectReadable: Boolean(payload?.data?.organization?.projectV2?.id),
            errors: Array.isArray(payload?.errors) ? payload.errors.map((e) => e.message) : [],
          }));
          NODE
