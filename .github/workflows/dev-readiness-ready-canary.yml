name: DEV readiness READY canary

on:
  push:
    branches:
      - chore/07-live-acceptance
    paths:
      - .github/workflows/dev-readiness-ready-canary.yml

permissions:
  contents: read

jobs:
  ready-canary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITHUB_TOKEN: ${{ secrets.CHIPIN_DEV_READ_TOKEN }}
      OUTPUT_PATH: dev-readiness-ready-canary.json
      ISSUE_REFS: >-
        ChipIn-one/chipin-frontend#285
        ChipIn-one/chipin-backend#9
        ChipIn-one/chipin-backend#91
        ChipIn-one/chipin-backend#94
        ChipIn-one/chipin-backend#106
        ChipIn-one/chipin-backend#118
        ChipIn-one/chipin-backend#128
        ChipIn-one/chipin-backend#130
        ChipIn-one/chipin-backend#137
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.21.0'

      - name: Run live READY canary batch
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t refs < <(printf '%s\n' "$ISSUE_REFS" | tr ' ' '\n' | sed '/^[[:space:]]*$/d')
          node automation/dev-readiness-live.mjs "${refs[@]}" --output "$OUTPUT_PATH"

      - name: Require a real READY_FOR_DEV receipt
        shell: bash
        run: |
          set -euo pipefail
          node - "$OUTPUT_PATH" <<'NODE'
          const fs = require('node:fs');
          const path = process.argv[2];
          const data = JSON.parse(fs.readFileSync(path, 'utf8'));
          if (data.readOnly !== true) throw new Error('receipt is not read-only');
          if ((data.schemaBlockers ?? []).length) {
            console.error(JSON.stringify(data.schemaBlockers, null, 2));
            process.exit(2);
          }
          const readFailures = (data.decisions ?? [])
            .filter((x) => Array.isArray(x.readErrors) && x.readErrors.length)
            .map((x) => ({ issue: x.issue, readErrors: x.readErrors }));
          for (const x of data.decisions ?? []) {
            console.log(`${x.issue}: ${x.decision?.state ?? 'UNKNOWN'} (Project: ${x.projectStatus ?? 'unreadable'}, read errors: ${x.readErrors?.length ?? 'unknown'})`);
          }
          if (readFailures.length) {
            console.error('Read failures:', JSON.stringify(readFailures, null, 2));
            process.exit(2);
          }
          const ready = (data.decisions ?? []).filter((x) => x.decision?.state === 'READY_FOR_DEV');
          if (!ready.length) {
            console.error('No real READY_FOR_DEV candidate exists in this native-linked batch.');
            process.exit(3);
          }
          console.log('READY_FOR_DEV evidence:', ready.map((x) => x.issue).join(', '));
          NODE

      - name: Upload canary receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dev-readiness-ready-canary-${{ github.run_id }}
          path: dev-readiness-ready-canary.json
          if-no-files-found: warn
          retention-days: 7
