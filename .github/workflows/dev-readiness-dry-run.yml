name: DEV readiness policy tests

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evaluate-fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check whitespace
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            pull_request)
              git diff --check "$BASE_SHA...$HEAD_SHA"
              ;;
            push)
              if [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
                git show --check --format= "$HEAD_SHA"
              else
                git diff --check "$BASE_SHA..$HEAD_SHA"
              fi
              ;;
            workflow_dispatch)
              if git rev-parse "$HEAD_SHA^1" >/dev/null 2>&1; then
                git diff --check "$HEAD_SHA^1..$HEAD_SHA"
              else
                git show --check --format= "$HEAD_SHA"
              fi
              ;;
            *)
              echo "Unsupported event for whitespace validation: $EVENT_NAME"
              exit 1
              ;;
          esac
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.21.0'
      - name: Run DEV readiness tests
        run: node --test automation/*.test.mjs
