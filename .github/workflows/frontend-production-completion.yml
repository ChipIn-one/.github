# Org sweep of the frontend completion (docs/workflow/completion.md). Runs the shared engine
# automation/completion.mjs for chipin-frontend with the organization PAT CHIPIN_ISSUE_WRITE_TOKEN; the strategy and
# whether the engine runs at all come from the registry record of the pinned checkout (this repository's master).
# Since .github#217 the record says `completion: deployment-receipt`, `capabilities.completion: automatic` and
# `completionRunner: org-sweep`: by owner decision (2026-10-22) chipin-frontend has no completion caller of its own, so
# this run is the only FE completion writer. It closes an Issue once every linked PR's merge commit is in a valid
# Vercel `Production` receipt (written by vercel[bot] at Promote to Production) and moves Todo / In Progress to
# `Awaiting release` for merged but not yet promoted work (the repository GITHUB_TOKEN cannot write the org Project).
# Latency (.github#228): within minutes of the Promote when chipin-frontend forwards its successful vercel[bot]
# Production deployment as repository_dispatch `frontend-production-deployed` (chipin-frontend#559); otherwise on the
# next push to master here or the next schedule run, which GitHub throttles (observed every ~5-6 hours, not the 15
# minutes the cron asks for). Conformance checks that this workflow keeps covering the repository
# (COMPLETION_SWEEP_MISSING). Emergency switch-off: set `capabilities.completion: manual` AND drop `completionRunner`
# in the frontend record (validation rejects org-sweep with manual); CHIPIN_COMPLETION_SKIP_MANUAL=1 then makes this run
# a green no-op (harmless while the record is automatic). Rollback to the dev/main record needs no change here.
# Runs only trusted master code: pushes to master, the schedule and repository_dispatch, which GitHub always runs from
# the default branch; there is no branch-selectable workflow_dispatch. The dispatch payload (deployment id, SHA) is only
# a hint and is never read: the engine re-reads the Vercel Production receipt itself, so a forged dispatch can at most
# start an ordinary sweep run.
name: Frontend production completion

on:
  push:
    branches:
      - master
  repository_dispatch:
    types: [frontend-production-deployed]
  schedule:
    - cron: "7,22,37,52 * * * *"

permissions:
  contents: read

concurrency:
  group: frontend-production-completion
  cancel-in-progress: false

jobs:
  close-completed-issues:
    name: Reconcile frontend completion and Awaiting release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Use Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "24.21.0"
      - name: Reconcile frontend production completion
        env:
          CHIPIN_CANONICAL_WRITE_TOKEN: ${{ secrets.CHIPIN_ISSUE_WRITE_TOKEN }}
          CHIPIN_COMPLETION_WRITE: "1"
          CHIPIN_COMPLETION_AWAITING_RELEASE: "1"
          CHIPIN_COMPLETION_SKIP_MANUAL: "1"
        run: node automation/completion.mjs --repository ChipIn-one/chipin-frontend
