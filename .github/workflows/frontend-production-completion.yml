# Org fallback of the frontend completion (completion: production-merge in workflow-registry.yaml;
# docs/workflow/completion.md). Runs the shared engine automation/completion.mjs for chipin-frontend with the
# organization PAT CHIPIN_ISSUE_WRITE_TOKEN: it closes Issues whose linked PRs reached `main` through a merged
# `dev -> main` release PR, keeps the Project #5 repair of an open Issue still showing derived Done, and
# (.github#180) moves the Project #5 Status of an Issue whose linked PRs are merged into `dev` but not yet
# released from Todo / In Progress to `Awaiting release`. The repository GITHUB_TOKEN of chipin-frontend
# cannot write the org Project, so this writer lives here, not in the repository-local action; the Status
# appears within one schedule interval (about 15 minutes) of the merge into `dev`.
# Runs only from trusted master pushes and the schedule; no branch-selectable dispatch.
name: Frontend production completion

on:
  push:
    branches:
      - master
  schedule:
    - cron: "7,22,37,52 * * * *"

permissions:
  contents: read

concurrency:
  group: frontend-production-completion
  cancel-in-progress: false

jobs:
  close-completed-issues:
    name: Close frontend Issues completed in production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24.21.0"
      - name: Reconcile frontend production completion
        env:
          CHIPIN_CANONICAL_WRITE_TOKEN: ${{ secrets.CHIPIN_ISSUE_WRITE_TOKEN }}
          CHIPIN_COMPLETION_WRITE: "1"
          CHIPIN_COMPLETION_AWAITING_RELEASE: "1"
        run: node automation/completion.mjs --repository ChipIn-one/chipin-frontend
