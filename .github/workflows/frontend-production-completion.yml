# Org sweep of the frontend completion (docs/workflow/completion.md). Runs the shared engine
# automation/completion.mjs for chipin-frontend with the organization PAT CHIPIN_ISSUE_WRITE_TOKEN; the strategy and
# whether the engine runs at all come from the registry record of the pinned checkout (this repository's master).
# Since the cutover to canonical `master` (chipin-frontend#497, .github#216) the record says
# `completion: deployment-receipt` with `capabilities.completion: manual`: with CHIPIN_COMPLETION_SKIP_MANUAL=1 the
# engine returns a `skipped` receipt before any GitHub read, so every run is a green no-op (no Issue closed, no
# Project #5 Status written) until .github#217 switches the capability to `automatic`. From then on this same run is
# the org fallback of deployment-receipt: close on a valid production receipt, and move Todo / In Progress to
# `Awaiting release` for merged but not yet received work (the repository GITHUB_TOKEN cannot write the org Project,
# so this writer lives here). Rollback to the dev/main record (production-merge, automatic) needs no change here.
# Runs only from trusted master pushes and the schedule; no branch-selectable dispatch.
name: Frontend production completion

on:
  push:
    branches:
      - master
  schedule:
    - cron: "7,22,37,52 * * * *"

permissions:
  contents: read

concurrency:
  group: frontend-production-completion
  cancel-in-progress: false

jobs:
  close-completed-issues:
    name: Reconcile frontend completion and Awaiting release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Use Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "24.21.0"
      - name: Reconcile frontend production completion
        env:
          CHIPIN_CANONICAL_WRITE_TOKEN: ${{ secrets.CHIPIN_ISSUE_WRITE_TOKEN }}
          CHIPIN_COMPLETION_WRITE: "1"
          CHIPIN_COMPLETION_AWAITING_RELEASE: "1"
          CHIPIN_COMPLETION_SKIP_MANUAL: "1"
        run: node automation/completion.mjs --repository ChipIn-one/chipin-frontend
