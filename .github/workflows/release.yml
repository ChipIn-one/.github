name: Release

# Reusable release workflow (docs/workflow/release.md, task .github#169). A caller repository runs it
# after a human merge into its release branch (templates/caller-release-*.yml). The job checks out this
# repository at the exact SHA the caller pinned (github.job_workflow_sha), so the engine, the registry and
# the caller pin move together. apply=false (default) only prints the plan; apply=true creates the tag and
# the GitHub Release through the caller's token, which needs contents: write on the calling repository.
on:
  workflow_call:
    inputs:
      ref:
        description: "Release commit (SHA or branch); empty = the caller's event SHA"
        required: false
        default: ""
        type: string
      initial-version:
        description: "First version X.Y.Z for a repository without tags; empty otherwise"
        required: false
        default: ""
        type: string
      apply:
        description: "Create the tag and the Release (false = plan only)"
        required: false
        default: false
        type: boolean
    secrets:
      token:
        description: "Token for the calling repository: contents read for plan, contents write for apply"
        required: true
    outputs:
      outcome:
        description: "PLANNED, NO_RELEASE, ALREADY_RELEASED, RELEASE_MISSING, RELEASED or BLOCKED"
        value: ${{ jobs.release.outputs.outcome }}
      tag:
        description: "Created or existing tag; empty when nothing is released"
        value: ${{ jobs.release.outputs.tag }}

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      outcome: ${{ steps.release.outputs.outcome }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - name: Checkout the pinned org automation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ChipIn-one/.github
          ref: ${{ github.job_workflow_sha }}
          path: chipin-workflow
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.21.0
          package-manager-cache: false
      - name: Release
        id: release
        uses: ./chipin-workflow/automation/release-action
        with:
          repository: ${{ github.repository }}
          ref: ${{ inputs.ref != '' && inputs.ref || github.sha }}
          token: ${{ secrets.token }}
          initial-version: ${{ inputs.initial-version }}
          apply: ${{ inputs.apply && 'true' || 'false' }}
          output: release-receipt.json
      - name: Upload receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-receipt-${{ github.run_id }}
          path: release-receipt.json
          if-no-files-found: warn
          retention-days: 90
