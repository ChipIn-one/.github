# Closes Issues of this repository whose Development-linked PRs merged into master
# (completion: integration-merge in workflow-registry.yaml).
# The Issues to close live in this repository, so the repository token with issues: write
# suffices and no PAT is used. Project #5 repair is off (CHIPIN_COMPLETION_PROJECT_RECONCILE=0)
# because GITHUB_TOKEN cannot read org Projects; the Done mirror is Project-side.
name: Integration completion

on:
  push:
    branches:
      - master
  schedule:
    - cron: "11,41 * * * *"

permissions:
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: integration-completion
  cancel-in-progress: false

jobs:
  close-completed-issues:
    name: Close Issues completed on the integration branch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24.21.0"
      - name: Reconcile integration completion
        env:
          CHIPIN_CANONICAL_WRITE_TOKEN: ${{ github.token }}
          CHIPIN_COMPLETION_WRITE: "1"
          CHIPIN_COMPLETION_PROJECT_RECONCILE: "0"
        run: node automation/completion.mjs --repository "$GITHUB_REPOSITORY"
