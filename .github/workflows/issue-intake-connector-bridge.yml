name: Connector issue intake bridge

on:
  issues:
    types:
      - opened
      - edited
      - reopened

permissions:
  contents: read
  issues: write

concurrency:
  # Valid requests require the title to equal "[issue-intake] owner/repo#number", so
  # using the title serializes every control issue for the same canonical target.
  group: connector-issue-intake-${{ github.event.issue.title }}
  cancel-in-progress: false

jobs:
  intake:
    if: startsWith(github.event.issue.title, '[issue-intake] ')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      REQUEST_PATH: issue-intake-request.json
      BRIDGE_RECEIPT_PATH: issue-intake-bridge-receipt.json
      INTAKE_RECEIPT_PATH: issue-intake-receipt.json
      COMMENT_PATH: issue-intake-comment.md

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.21.0'

      - name: Validate connector request
        id: validate
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          node automation/issue-intake-request.mjs validate \
            --event "$GITHUB_EVENT_PATH" \
            --config automation/metadata-migration.config.json \
            --request-output "$REQUEST_PATH" \
            --bridge-output "$BRIDGE_RECEIPT_PATH"

      - name: Apply canonical issue intake
        id: apply
        if: steps.validate.outcome == 'success'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.CHIPIN_ISSUE_WRITE_TOKEN }}
          CHIPIN_ISSUE_WRITE: "1"
        shell: bash
        run: |
          set -euo pipefail
          node automation/issue-intake-request.mjs apply \
            --request "$REQUEST_PATH" \
            --bridge-output "$BRIDGE_RECEIPT_PATH" \
            --intake-output "$INTAKE_RECEIPT_PATH"

      - name: Render request receipt comment
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          node automation/issue-intake-request.mjs render \
            --receipt "$BRIDGE_RECEIPT_PATH" \
            --output "$COMMENT_PATH"

      - name: Comment request receipt
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REQUEST_URL: ${{ github.event.issue.html_url }}
        shell: bash
        run: |
          set -euo pipefail
          gh issue comment "$REQUEST_URL" --body-file "$COMMENT_PATH"

      - name: Upload bridge receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: connector-issue-intake-${{ github.run_id }}
          path: |
            issue-intake-bridge-receipt.json
            issue-intake-receipt.json
          if-no-files-found: warn
          retention-days: 30

      - name: Enforce successful canonical completion
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          node automation/issue-intake-request.mjs assert-success \
            --receipt "$BRIDGE_RECEIPT_PATH"
