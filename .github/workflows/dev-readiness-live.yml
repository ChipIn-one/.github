name: DEV readiness live acceptance

on:
  workflow_dispatch:
    inputs:
      issue_refs:
        description: "Whitespace/comma-separated exact issue refs (owner/repo#number)"
        required: true
        default: "ChipIn-one/chipin-frontend#164 ChipIn-one/chipin-frontend#194 ChipIn-one/chipin-backend#117 ChipIn-one/chipin-backend#144 ChipIn-one/chipin-knowledge-base#5"

permissions:
  contents: read

jobs:
  live-readonly:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITHUB_TOKEN: ${{ secrets.CHIPIN_DEV_READ_TOKEN }}
      ISSUE_REFS: ${{ inputs.issue_refs }}
      OUTPUT_PATH: dev-readiness-live.json
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.21.0'

      - name: Verify read-only token is configured
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${GITHUB_TOKEN:-}" ]; then
            echo "CHIPIN_DEV_READ_TOKEN is not configured."
            exit 1
          fi

      - name: Run adapter contract tests
        run: node --test automation/*.test.mjs

      - name: Run live read-only acceptance
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t refs < <(printf '%s\n' "$ISSUE_REFS" | tr ' ,' '\n\n' | sed '/^[[:space:]]*$/d')
          if [ "${#refs[@]}" -eq 0 ]; then
            echo "No issue refs provided."
            exit 1
          fi
          node automation/dev-readiness-live.mjs "${refs[@]}" --output "$OUTPUT_PATH"

      - name: Validate and summarize receipt
        shell: bash
        run: |
          set -euo pipefail
          node - "$OUTPUT_PATH" <<'NODE'
          const fs = require('node:fs');
          const path = process.argv[2];
          const data = JSON.parse(fs.readFileSync(path, 'utf8'));
          if (data.readOnly !== true) {
            throw new Error('Live receipt is not marked readOnly=true');
          }
          if (!Array.isArray(data.schemaBlockers)) {
            throw new Error('Live receipt schemaBlockers is unreadable');
          }
          console.log(`generatedAt: ${data.generatedAt}`);
          console.log(`Project #${data.project?.number}: ${data.project?.totalCount ?? 'unknown'} items`);
          console.log(`schema blockers: ${data.schemaBlockers.length}`);
          for (const item of data.decisions ?? []) {
            console.log(`${item.issue}: ${item.decision?.state ?? 'UNKNOWN'} (Project: ${item.projectStatus ?? 'unreadable'}, blockers: ${item.adapterBlockers?.length ?? 0})`);
          }
          if (data.schemaBlockers.length > 0) {
            console.error(JSON.stringify(data.schemaBlockers, null, 2));
            process.exitCode = 2;
          }
          NODE

      - name: Upload timestamped live receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dev-readiness-live-${{ github.run_id }}
          path: dev-readiness-live.json
          if-no-files-found: warn
          retention-days: 30
