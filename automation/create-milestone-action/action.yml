name: Create repository milestone
description: Safely create or reuse a native milestone from one authorized repository-local control Issue.
inputs:
  issue-number:
    description: Existing repository-local control Issue number.
    required: true
  token:
    description: Caller repository's GITHUB_TOKEN with issues:write and contents:read.
    required: true
runs:
  using: composite
  steps:
    - name: Reconcile milestone control Issue
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.token }}
        CONTROL_ISSUE_NUMBER: ${{ inputs.issue-number }}
      run: node "$GITHUB_ACTION_PATH/../create-milestone.mjs"
