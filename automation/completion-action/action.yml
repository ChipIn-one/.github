name: ChipIn completion
description: Close eligible Issues of the repository by the registry completion strategy (integration-merge, deployment-receipt); optionally write Awaiting release.
inputs:
  token:
    description: GitHub token with contents read, pull requests read, deployments read (deployment-receipt) and issues write. With awaiting-release true it must be an organization token that also reads and writes Project #5.
    required: true
  repository:
    description: Repository (owner/name) whose Issues are reconciled.
    required: false
    default: ${{ github.repository }}
  awaiting-release:
    description: "\"true\" turns on Project #5 reconciliation and the Awaiting release writer (deployment-receipt, production-merge); needs the organization token above. Default \"false\": repository token, no Project reads or writes."
    required: false
    default: "false"
runs:
  using: composite
  steps:
    - name: Reconcile completion
      shell: bash
      env:
        CHIPIN_CANONICAL_WRITE_TOKEN: ${{ inputs.token }}
        CHIPIN_COMPLETION_WRITE: "1"
        CHIPIN_COMPLETION_PROJECT_RECONCILE: "0"
        COMPLETION_REPOSITORY: ${{ inputs.repository }}
        COMPLETION_AWAITING_RELEASE: ${{ inputs.awaiting-release }}
      run: |
        set -euo pipefail
        case "$COMPLETION_AWAITING_RELEASE" in
          false) ;;
          true)
            # the writer needs Project #5: reconciliation on, writer on (the engine refuses the writer without it)
            export CHIPIN_COMPLETION_PROJECT_RECONCILE=1
            export CHIPIN_COMPLETION_AWAITING_RELEASE=1
            ;;
          *)
            echo "::error::awaiting-release must be \"true\" or \"false\", got \"$COMPLETION_AWAITING_RELEASE\""
            exit 1
            ;;
        esac
        node "$GITHUB_ACTION_PATH/../completion.mjs" --repository "$COMPLETION_REPOSITORY"
