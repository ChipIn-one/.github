name: ChipIn completion
description: Close eligible Issues of the repository after their Development-linked PRs merge into the registry integration branch.
inputs:
  token:
    description: Repository-local GitHub token with contents read, pull requests read, and issues write.
    required: true
  repository:
    description: Repository (owner/name) whose Issues are reconciled.
    required: false
    default: ${{ github.repository }}
runs:
  using: composite
  steps:
    - name: Reconcile completion
      shell: bash
      env:
        CHIPIN_CANONICAL_WRITE_TOKEN: ${{ inputs.token }}
        CHIPIN_COMPLETION_WRITE: "1"
        CHIPIN_COMPLETION_PROJECT_RECONCILE: "0"
        COMPLETION_REPOSITORY: ${{ inputs.repository }}
      run: |
        set -euo pipefail
        node "$GITHUB_ACTION_PATH/../completion.mjs" --repository "$COMPLETION_REPOSITORY"
