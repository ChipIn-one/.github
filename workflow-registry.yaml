# ChipIn workflow registry — single source for which repositories take part in the
# shared workflow, with which branches, owner and capabilities.
# Spec: docs/workflow/README.md §2. Loader and validator: automation/registry.mjs.
#
# This file is parsed by a strict built-in YAML subset reader (no dependencies):
# block mappings, block sequences, one-line [flow] sequences, one-line {flow} mappings,
# plain/quoted scalars, null, booleans and integers. Anchors, tags, multi-line scalars
# and duplicate keys are rejected. Unknown keys fail validation.
#
# `completion: deployment-receipt` also needs `productionEvidence: { environment: <name>, creator: "<login>" }`
# (quote a `[bot]` login inside a flow mapping) and `deploymentProfile: production`; no other strategy may carry it.
# `completionRunner` (optional, default `repository`): `org-sweep` means the engine runs only from an org sweep workflow
# in this repository (no completion caller in the target repository); it needs `capabilities.completion: automatic`.
schemaVersion: 1
standardVersion: v1            # tag line of the standard this registry agrees with
project:
  number: 5
  statuses: [Backlog, Todo, In Progress, Awaiting release, Done]   # Done is a derived mirror only
repositories:
  - repository: ChipIn-one/chipin-frontend
    kind: code                 # code | docs | meta
    visibility: public
    owner: syllik              # required native assignee; null is allowed for docs (chosen at intake)
    branches: { default: master, integration: master }   # canonical master, no promotion branch (chipin-frontend#497)
    deploymentProfile: production      # none | staging | production
    completion: deployment-receipt     # production-merge | integration-merge | deployment-receipt | manual
    productionEvidence: { environment: Production, creator: "vercel[bot]" }
    completionRunner: org-sweep        # repository | org-sweep; no FE caller: only .github/workflows/frontend-production-completion.yml (#217)
    protection: ruleset                # ruleset | protection | unavailable (Free + private)
    requiredChecks: [frontend-ci]
    # tag + GitHub Release after every successful Vercel Production deploy; the tags arrive with #171/#172
    release: { strategy: deploy-tag, trigger: production-deploy, tagPrefix: v }
    capabilities:
      admission: required       # required | advisory | off
      developmentLink: required
      prMetadata: required
      relationships: required   # blocked-by gate in admission
      completion: automatic     # automatic | manual; engine on since #217 (Promote evidence checked in cutover step 7)
      milestones: enabled
      dependabot: required
      agentRouting: required    # AGENTS.md routing block + .ai/context.md
  - repository: ChipIn-one/chipin-backend
    kind: code
    visibility: private
    owner: olegbal
    branches: { default: develop, integration: develop }
    deploymentProfile: production
    completion: manual                  # deployment-receipt decided (#156); manual until the evidence step (chipin-backend#213), see docs/workflow/backend.md
    protection: unavailable             # until the Team upgrade (#161)
    requiredChecks: [Unit and integration tests]
    release: { strategy: deploy-tag, trigger: production-deploy, tagPrefix: v }       # tag + GitHub Release after every successful Deploy Production
    capabilities: { admission: advisory, developmentLink: required, prMetadata: required, relationships: required, completion: manual, milestones: enabled, dependabot: required, agentRouting: required }
  - repository: ChipIn-one/chipin-knowledge-base
    kind: docs
    visibility: private
    owner: null
    branches: { default: master, integration: master }
    deploymentProfile: none
    completion: integration-merge       # the Issue closes after its linked PR merged into master (#179)
    protection: unavailable
    requiredChecks: []
    release: { strategy: none }                                                        # documents: no versions, no releases
    capabilities: { admission: advisory, developmentLink: required, prMetadata: off, relationships: required, completion: automatic, milestones: off, dependabot: required, agentRouting: required }
  - repository: ChipIn-one/.github
    kind: meta
    visibility: public
    owner: syllik
    branches: { default: master, integration: master }
    deploymentProfile: none
    completion: integration-merge       # the Issue closes after its linked PR merged into master (#179)
    protection: ruleset
    requiredChecks: [evaluate-fixtures]
    release: { strategy: semver-by-impact, trigger: integration-merge, tagPrefix: v }  # tag + GitHub Release after a merge that changes automation, workflows or the registry
    capabilities: { admission: advisory, developmentLink: required, prMetadata: off, relationships: required, completion: automatic, milestones: off, dependabot: required, agentRouting: required }
  - repository: ChipIn-one/chipin-notifications
    kind: docs
    visibility: private
    owner: null
    branches: { default: master, integration: master }
    deploymentProfile: none
    completion: manual
    protection: unavailable
    requiredChecks: []
    release: { strategy: none }                                                        # design documents: no versions, no releases
    # Registered for the release policy only; every other capability is off until the owner opts in.
    capabilities: { admission: off, developmentLink: off, prMetadata: off, relationships: off, completion: manual, milestones: off, dependabot: off, agentRouting: off }
